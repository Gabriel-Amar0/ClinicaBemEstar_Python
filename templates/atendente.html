<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Atendente - Clínica Bem Estar</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <header class="header-painel d-flex align-items-center justify-content-between px-4 py-2 shadow-sm">
    <div class="d-flex align-items-center gap-3">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="logo-header">
      <div>
        <h5 class="mb-0 fw-bold text-primary">Clínica Bem Estar</h5>
        <small class="text-muted">Painel do Atendente</small>
      </div>
    </div>
    <nav class="d-flex align-items-center gap-3">
      <a href="#" class="nav-link active">Agendar Consulta</a>
      <a href="#" class="nav-link">Cadastrar Paciente</a>
      <a href="#" class="nav-link">Listar Consultas</a>
      <a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm">Sair</a>
    </nav>
  </header>

  <div class="container mt-4">

    <!-- CADASTRAR PACIENTE -->
    <div id="cadastro" class="conteudo-secao escondido">
      <h4 class="fw-bold text-primary">Cadastro de Paciente</h4>
      <form id="formCadastro" class="row g-3 mt-3">
        <div class="col-md-6">
          <label class="form-label">Nome Completo</label>
          <input type="text" class="form-control" id="paciente-nome" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">CPF</label>
          <input type="text" class="form-control" id="paciente-cpf" placeholder="000.000.000-00" maxlength="14" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Data de Nascimento</label>
          <input type="date" class="form-control" id="paciente-nascimento" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Telefone</label>
          <input type="text" class="form-control" id="paciente-telefone" placeholder="(00) 00000-0000" maxlength="15" required>
        </div>
        <div class="col-md-8">
          <label class="form-label">Endereço</label>
          <input type="text" class="form-control" id="paciente-endereco" required>
        </div>

        <!-- TRIAGEM -->
        <h5 class="fw-bold text-secondary mt-3">Triagem</h5>
        <div class="col-md-3">
          <label class="form-label">Peso (kg)</label>
          <input type="number" class="form-control" id="paciente-peso" step="0.1" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Altura (m)</label>
          <input type="number" class="form-control" id="paciente-altura" step="0.01" required>
        </div>

        <div class="col-12 text-center">
          <button type="submit" class="btn btn-primary px-4">Cadastrar</button>
        </div>
      </form>
    </div>

    <!-- AGENDAR CONSULTA -->
    <div id="agendar" class="conteudo-secao">
      <h4 class="fw-bold text-primary">Agendar Consulta</h4>
      <form id="formAgendar" class="row g-3 mt-3">
        <div class="col-md-6">
          <label class="form-label">Paciente</label>
          <select id="form-paciente" class="form-select" required></select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Data e Hora</label>
          <input type="datetime-local" id="form-datahora" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Observações</label>
          <input type="text" id="form-obs" class="form-control" placeholder="Ex: Retorno, dor de cabeça..." required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Médico (ID)</label>
          <select id="form-medico" class="form-select" required>
            <option value="" selected disabled>Selecione</option>
            <option value="1">Dr. João Silva (ID: 1)</option>
            <option value="2">Dra. Maria Oliveira (ID: 2)</option>
            <option value="3">Dr. Carlos Pereira (ID: 3)</option>
          </select>
        </div>
        <div class="col-12 text-center">
          <button type="submit" class="btn btn-primary px-4">Agendar</button>
        </div>
      </form>
    </div>

    <!-- LISTAR CONSULTAS -->
    <div id="consultas" class="conteudo-secao escondido">
      <h4 class="fw-bold text-primary">Listar Consultas</h4>
      <div class="table-responsive">
        <table class="table table-striped mt-3 align-middle" id="tabelaConsultas">
          <thead>
            <tr>
              <th>ID</th>
              <th>ID Médico</th>
              <th>Nome</th>
              <th>Contato</th>
              <th>CPF</th>
              <th>Data e Hora</th>
              <th>Observações</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL EDITAR CONSULTA -->
  <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Editar Consulta</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formEditar" class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nome</label>
              <input type="text" class="form-control" id="edit-nome" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Contato</label>
              <input type="text" class="form-control" id="edit-contato" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">CPF</label>
              <input type="text" class="form-control" id="edit-cpf" maxlength="14" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Data e Hora</label>
              <input type="text" class="form-control" id="edit-datahora" required>
            </div>
            <div class="col-md-12">
              <label class="form-label">Observações</label>
              <input type="text" class="form-control" id="edit-obs" required>
            </div>
            <div class="col-md-12">
              <label class="form-label">Status</label>
              <select id="edit-status" class="form-select">
                <option value="Agendado">Agendado</option>
                <option value="Concluído">Concluído</option>
                <option value="Cancelado">Cancelado</option>
              </select>
            </div>
            <div class="col-12 text-end">
              <button type="submit" class="btn btn-success">Salvar Alterações</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Bootstrap -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="toastSuccess" class="toast align-items-center text-bg-success border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastMessage">Ação realizada com sucesso!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="{{ url_for('static', filename='js/typeuser.js') }}"></script>

  <!-- Máscaras e Select de Pacientes -->
  <script>
    // Máscaras CPF e Telefone (cadastro e edição)
    document.addEventListener('input', (e) => {
      const id = e.target.id;

      if (id === 'paciente-cpf' || id === 'edit-cpf') {
        let v = e.target.value.replace(/\D/g, '');
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        e.target.value = v;
      }

      if (id === 'paciente-telefone' || id === 'edit-contato') {
        let v = e.target.value.replace(/\D/g, '');
        v = v.replace(/^(\d{2})(\d)/g, '($1) $2');
        v = v.replace(/(\d{5})(\d)/, '$1-$2');
        e.target.value = v;
      }
    });

    // Carregar pacientes (mostrar apenas nomes)
    async function carregarPacientes() {
      try {
        const resp = await fetch('/api/pacientes');
        const pacientes = await resp.json();
        const select = document.getElementById('form-paciente');
        select.innerHTML = '<option value="" selected disabled>Selecione</option>';
        pacientes.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.cpf;  // valor interno
          opt.textContent = p.nome;  // mostra só o nome
          select.appendChild(opt);
        });
      } catch (err) {
        console.error('Erro ao carregar pacientes:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', carregarPacientes);
  </script>
</body>
</html>
