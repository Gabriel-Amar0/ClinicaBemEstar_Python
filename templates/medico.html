<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Médico - Clínica Bem Estar</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body data-medico-id="{{ user.id }}">

  <header class="header-painel d-flex align-items-center justify-content-between px-4 py-2 shadow-sm bg-white border-bottom">
    <div class="d-flex align-items-center gap-3">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" style="height: 50px; width: auto;">
      <div class="d-flex flex-column">
        <h5 class="mb-0 fw-bold text-primary">Clínica Bem Estar</h5>
        <small class="text-muted">Painel do Médico</small>
      </div>
    </div>

    <nav class="d-flex align-items-center gap-3">
      <a href="#" class="nav-link active fw-semibold" data-aba="consultas-agendadas">Consultas Agendadas</a>
      <a href="#" class="nav-link fw-semibold" data-aba="pacientes">Pacientes Cadastrados</a>
      <a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm">
        <i class="bi bi-box-arrow-right"></i> Sair
      </a>
    </nav>
  </header>

  <main class="container mt-4">

    <section id="consultas-agendadas" class="conteudo-secao">
      
      <h3 class="mb-4 text-primary fw-bold">Listar Consultas</h3>

      <div class="row g-2 align-items-center mb-3">
          <div class="col-md-3">
              <select id="filtro-campo" class="form-select border-secondary-subtle">
                  <option value="todos">Todos os campos</option>
                  <option value="datahora">Data</option>
                  <option value="paciente_nome">Nome do Paciente</option>
                  <option value="cpf">CPF</option>
                  <option value="id">ID da Consulta</option>
              </select>
          </div>
          <div class="col-md-7">
              <input type="text" id="filtro-texto" class="form-control border-secondary-subtle" placeholder="Digite para buscar...">
          </div>
          <div class="col-md-2">
              <button id="btn-buscar" class="btn btn-primary w-100">
                  <i class="bi bi-search"></i> Buscar
              </button>
          </div>
      </div>

      <div class="table-responsive shadow-sm rounded border bg-white">
        <table class="table table-striped table-hover align-middle mb-0" id="tabelaConsultasMedico">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>ID Méd.</th>
              <th>Nome</th>
              <th>Contato</th>
              <th>CPF</th>
              <th>Data e Hora</th>
              <th>Observações</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3">
        <span id="info-paginacao" class="text-dark fw-bold small">Mostrando 0 - 0 de 0</span>
        <div class="d-flex gap-2">
            <button id="btn-ant" class="btn btn-light text-primary border shadow-sm px-4 fw-bold" disabled>
                <i class="bi bi-chevron-left"></i> Anterior
            </button>
            <button id="btn-prox" class="btn btn-primary shadow-sm px-4 fw-bold">
                Próxima <i class="bi bi-chevron-right"></i>
            </button>
        </div>
      </div>

    </section>

    <section id="pacientes" class="conteudo-secao escondido">
      <h3 class="mb-4 text-primary fw-bold">Pacientes Cadastrados</h3>

      <div class="row g-2 align-items-center mb-3">
          <div class="col-md-3">
              <select id="filtro-campo-pac" class="form-select border-secondary-subtle">
                  <option value="todos">Todos os campos</option>
                  <option value="nome">Nome</option>
                  <option value="cpf">CPF</option>
                  <option value="id">ID</option>
              </select>
          </div>
          <div class="col-md-7">
              <input type="text" id="filtro-texto-pac" class="form-control border-secondary-subtle" placeholder="Busque por nome, CPF ou ID...">
          </div>
          <div class="col-md-2">
              <button id="btn-buscar-pac" class="btn btn-primary w-100">
                  <i class="bi bi-search"></i> Buscar
              </button>
          </div>
      </div>

      <div class="table-responsive shadow-sm rounded border bg-white">
        <table class="table table-striped table-hover align-middle mb-0" id="tabelaPacientesMedico">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>CPF</th>
              <th>Data Nasc.</th>
              <th>Peso (kg)</th>
              <th>Altura (m)</th>
            </tr>
          </thead>
          <tbody>
            </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3">
        <span id="info-paginacao-pac" class="text-dark fw-bold small">Mostrando 0 - 0 de 0</span>
        <div class="d-flex gap-2">
            <button id="btn-ant-pac" class="btn btn-light text-primary border shadow-sm px-4 fw-bold" disabled>
                <i class="bi bi-chevron-left"></i> Anterior
            </button>
            <button id="btn-prox-pac" class="btn btn-primary shadow-sm px-4 fw-bold">
                Próxima <i class="bi bi-chevron-right"></i>
            </button>
        </div>
      </div>
    </section>
  </main>

  <div class="modal fade" id="modalEditarConsulta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Editar Consulta</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formEditarConsulta" class="row g-3">
            <input type="hidden" id="edit-id">
            <div class="col-md-6">
              <label class="form-label">Paciente</label>
              <input type="text" id="edit-nome" class="form-control bg-light" readonly>
            </div>
            <div class="col-md-6">
              <label class="form-label">CPF</label>
              <input type="text" id="edit-cpf" class="form-control bg-light" readonly>
            </div>
            <div class="col-md-6">
              <label class="form-label">Contato</label>
              <input type="text" id="edit-contato" class="form-control bg-light" readonly>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Data e Hora</label>
              <input type="datetime-local" id="edit-datahora" class="form-control border-primary" required>
            </div>
            <div class="col-md-12">
              <label class="form-label fw-bold">Descrição</label>
              <input type="text" id="edit-obs" class="form-control border-primary" required>
            </div>
            <div class="col-md-12">
              <label class="form-label fw-bold">Status</label>
              <select id="edit-status" class="form-select border-primary">
                <option value="Agendado">Agendado</option>
                <option value="Concluído">Concluído</option>
                <option value="Cancelado">Cancelado</option>
              </select>
            </div>
            <div class="col-12 text-end mt-4">
              <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-success">Salvar Alterações</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1060;">
    <div id="toastAviso" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          <i class="bi bi-info-circle-fill me-2"></i> <span id="toast-msg">Aviso</span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/medico.js') }}"></script>
</body>
</html>
